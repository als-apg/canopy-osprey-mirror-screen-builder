name: Build image and deploy dev

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-deploy:
    permissions:
      contents: read
      packages: write
    # TODO: repin to a commit on swapps-ci-helpers' main once
    # https://github.com/slaclab/swapps-ci-helpers/pull/6 merges. This SHA is
    # that PR's head — the reusable workflow does not exist on main yet.
    uses: slaclab/swapps-ci-helpers/.github/workflows/build-image-and-dispatch.yml@1e64b990ae8d9913dc535a5a43c41a220ba8b29a
    with:
      app: canopy-screen-builder
      environment: dev
      dockerfile: Dockerfile
      context: .
      # BASE_PATH is baked into the bundle's asset URLs by Vite and rendered into
      # the nginx location blocks, so it must match the ingress path in
      # swapps-deployment (apps/canopy-screen-builder/base/ingress.yaml). Changing
      # the route means changing it in both repos.
      build-args: |
        BASE_PATH=/screen-builder/
    secrets:
      APP_ID: ${{ secrets.APP_ID }}
      APP_PRIVATE_KEY: ${{ secrets.APP_PRIVATE_KEY }}
