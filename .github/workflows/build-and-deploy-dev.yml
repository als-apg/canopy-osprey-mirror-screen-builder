name: Build image and deploy dev

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-deploy:
    permissions:
      contents: read
      packages: write
    # Pinned to swapps-ci-helpers main (merge of #10, which split the combined
    # workflow into build-ghcr-image.yml + dispatch-swapps-deployment.yml; the
    # combined entry point below is still supported).
    #
    # NOTE: this build fails until the reusable workflow gains a `build-secrets`
    # input. The image needs a token to install @slaclab/canopy-screen-ir from
    # npm.pkg.github.com, which requires auth even for public packages, and
    # neither the combined workflow nor build-ghcr-image.yml can currently pass
    # a secret to `docker build`.
    uses: slaclab/swapps-ci-helpers/.github/workflows/build-image-and-dispatch.yml@73e6ba924aac5f822b050bd6bed12b0e45c64034
    with:
      app: canopy-screen-builder
      environment: dev
      dockerfile: Dockerfile
      context: .
      # BASE_PATH is baked into the bundle's asset URLs by Vite and rendered into
      # the nginx location blocks, so it must match the ingress path in
      # swapps-deployment (apps/canopy-screen-builder/base/ingress.yaml). Changing
      # the route means changing it in both repos.
      build-args: |
        BASE_PATH=/screen-builder/
      # Mounted by the Dockerfile as --mount=type=secret,id=node_auth_token. A
      # build secret rather than a build arg: an arg stays readable in the
      # published image's `docker history`.
      build-secrets: |
        id=node_auth_token,env=NODE_AUTH_TOKEN
    secrets:
      APP_ID: ${{ secrets.APP_ID }}
      APP_PRIVATE_KEY: ${{ secrets.APP_PRIVATE_KEY }}
      # Reading a package in this org needs no PAT; the job's own token suffices.
      NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
